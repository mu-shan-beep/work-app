<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台</title>
<style>
:root{
  --bg:#F4F1E9;
  --rail:#FFFFFF;
  --card:#FFFFFF;
  --soft:#FAF8F3;
  --line:#E9E3D6;
  --line-2:#D8D1C0;
  --ink:#1D1A15;
  --ink-2:#57524A;
  --ink-3:#8A8377;
  --ink-4:#B4ADA0;
  --brand:#D95F35;
  --brand-d:#B94A24;
  --brand-bg:#FCEDE5;
  --ok:#15803D;
  --ok-bg:#E6F4EC;
  --doing:#2C6BC9;
  --doing-bg:#E9F1FC;
  --wait:#B07000;
  --wait-bg:#FAEFD6;
  --r:14px;
  --sh:0 1px 2px rgba(45,38,26,.05),0 2px 8px rgba(45,38,26,.04);
  --sh-2:0 2px 6px rgba(45,38,26,.06),0 10px 24px rgba(45,38,26,.06);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--f);background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#DCD6C7;border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}

#app{display:flex;height:100vh;overflow:hidden}

/* ══════════════ 侧栏 ══════════════ */
.rail{
  width:224px;flex:none;background:var(--rail);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40;overflow:hidden;
}
.rail-hd{padding:18px 16px 12px;display:flex;align-items:center;gap:9px;flex:none}
.logo{
  width:28px;height:28px;border-radius:8px;flex:none;
  background:linear-gradient(140deg,#EE8158,#D95F35 60%,#B94A24);
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:13px;font-weight:700;box-shadow:0 2px 5px rgba(217,95,53,.28);
}
.rail-hd .who{min-width:0}
.rail-hd b{font-size:14px;font-weight:600;display:block;letter-spacing:-.01em;white-space:nowrap}
.rail-hd span{display:block;font-size:11px;color:var(--ink-3);margin-top:1px;white-space:nowrap}

.rail-body{flex:1;overflow-y:auto;padding:2px 8px 10px;min-height:0}
.rgroup{
  font-size:10px;font-weight:600;color:var(--ink-4);letter-spacing:.14em;
  padding:14px 8px 6px;display:flex;align-items:center;gap:7px;
}
.rgroup::after{content:'';flex:1;height:1px;background:var(--line)}
.ritem{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:7px 8px;border-radius:8px;margin-bottom:2px;
  color:var(--ink-2);transition:background .12s,color .12s;text-align:left;
  border:1px solid transparent;
}
.ritem:hover{background:#F7F4ED;color:var(--ink)}
.ritem.on{background:var(--brand-bg);color:var(--ink);font-weight:600}
.ritem .dm{width:7px;height:7px;border-radius:2px;flex:none;background:var(--ink-4)}
.ritem .nm{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .ct{
  font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  background:#F4F1E9;border-radius:5px;padding:0 5px;min-width:19px;height:17px;
  display:flex;align-items:center;justify-content:center;
}
.ritem.on .ct{background:#fff;color:var(--brand-d);font-weight:600}

.rail-ft{padding:9px 8px;border-top:1px solid var(--line);flex:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 11px;border-radius:8px;font-size:12px;font-weight:500;
  border:1px solid var(--line-2);background:#fff;color:var(--ink-2);
  transition:.13s;white-space:nowrap;
}
.btn:hover{background:var(--soft);border-color:var(--ink-4);color:var(--ink)}
.btn.wide{width:100%}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.55;cursor:default}

/* ══════════════ 主区 ══════════════ */
.main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden}
.wrap{max-width:1360px;margin:0 auto;padding:22px 24px 64px}
.mbar{display:none}

.top{margin-bottom:16px}
.hello h1{font-size:22px;font-weight:600;letter-spacing:-.022em;line-height:1.3}
.hello p{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.hello p b{color:var(--ink-2);font-weight:600}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.kpi{
  background:var(--kc-bg,#fff);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;transition:border-color .13s;
}
.kpi:hover{border-color:var(--line-2)}
.kpi .k{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.kpi .k i{width:5px;height:5px;border-radius:50%;background:var(--ink-4);display:inline-block}
.kpi .v{font-size:23px;font-weight:600;letter-spacing:-.025em;margin-top:2px;line-height:1.15;color:var(--kc,var(--ink))}
.kpi .v small{font-size:11.5px;font-weight:400;color:var(--ink-3);margin-left:3px;letter-spacing:0}

/* ═══════ Bento ═══════ */
.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:14px 15px;
  display:flex;flex-direction:column;min-width:0;
  transition:border-color .14s,box-shadow .14s;
}
.card:hover{border-color:var(--line-2);box-shadow:var(--sh-2)}
.s2{grid-column:span 2}
.s3{grid-column:span 3}

.chead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex:none}
.chead .dm{
  width:18px;height:18px;border-radius:6px;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.chead .dm::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff;opacity:.95}
.chead h2{font-size:13.5px;font-weight:600;letter-spacing:-.005em;flex:none}
.chead .ct{font-size:11px;color:var(--ink-3);flex:1;text-align:right}
.chead .more{
  font-size:11px;color:var(--ink-3);padding:2px 6px;border-radius:6px;transition:.12s;flex:none;
}
.chead .more:hover{background:var(--soft);color:var(--brand-d)}
.cbody{flex:1;min-height:0;display:flex;flex-direction:column}

/* 今日重点 */
.focus-list{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.frow{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;
  background:var(--soft);border:1px solid transparent;cursor:pointer;transition:.13s;
}
.frow:hover{background:#fff;border-color:var(--line-2)}
.frow .no{
  width:18px;height:18px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;background:var(--brand-bg);color:var(--brand-d);
}
.frow .info{flex:1;min-width:0}
.frow .tt{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .nx{font-size:11px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .mt{font-size:12px;color:var(--ink-2);font-weight:600;flex:none}
.bar{height:3px;border-radius:99px;background:#EEEAE0;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .3s}
.bar i.g{background:var(--ok)}

.fslot{
  flex:0 0 auto;height:54px;margin-top:6px;
  border:1.5px dashed var(--line-2);border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;color:var(--ink-4);transition:.14s;background:transparent;
}
.fslot:hover{border-color:var(--brand);color:var(--brand-d);background:var(--brand-bg)}
.dragtip{
  margin-top:auto;padding-top:11px;font-size:10.5px;color:var(--ink-4);
  display:flex;align-items:center;gap:5px;
}
.dragtip svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.n-only{display:none}

.empty{
  padding:14px;border-radius:9px;background:var(--soft);
  font-size:12px;color:var(--ink-3);text-align:center;line-height:1.7;
}
.focuscard{background:linear-gradient(168deg,#FFF7F1 0%,#FFFFFF 52%)}

/* 打卡 */
.habit{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:none;padding-bottom:1px}
.habit .tick{
  width:24px;height:24px;border-radius:7px;flex:none;border:1.5px solid #DCD5C4;
  background:#F8F5EE;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:.14s;
}
.habit .tick:hover{border-color:var(--ok);background:var(--ok-bg)}
.habit .tick.on{background:var(--ok);border-color:var(--ok)}
.habit .tick svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:.14s}
.habit .tick.on svg{opacity:1}
.habit .info{flex:1;min-width:0}
.habit .tt{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit.done .tt{color:var(--ink-4);text-decoration:line-through}
.habit .sub{font-size:10.5px;color:var(--ink-3);margin-top:0}
.week{display:flex;gap:3px;flex:none}
.week i{width:8px;height:8px;border-radius:2px;background:#E4DED0;cursor:pointer;transition:.12s}
.week i:hover{background:var(--line-2)}
.week i.on{background:var(--ok)}

/* 教案矩阵 */
.mx{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:12.5px}
.mx th{
  font-size:11px;font-weight:500;color:var(--ink-3);text-align:center;
  padding:0 0 8px;letter-spacing:.01em;white-space:nowrap;
}
.mx th.l{text-align:left}
.mx th.p{text-align:right}
.mx td{padding:0;border-top:1px solid var(--line);height:38px;vertical-align:middle}
.mx td.c{text-align:center}
.mx td.p{text-align:right}
.mx tbody tr{cursor:pointer;transition:background .12s}
.mx tbody tr:hover{background:var(--soft)}
.mx td.n{padding-left:2px;overflow:hidden}
.mx td.n .nm{
  font-size:12.5px;font-weight:500;color:var(--ink);
  display:inline-flex;align-items:center;gap:5px;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;
}
.mx tbody tr:hover td.n .nm{color:var(--brand-d)}
.mx td.p .pc{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.mx td.p .pc.done{color:var(--ok)}
.mx td.p .pc.zero{color:var(--ink-4);font-weight:400}

.dot{
  display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;
  cursor:pointer;transition:transform .12s,box-shadow .12s;border:1px solid transparent;
}
.dot:hover{transform:scale(1.18);box-shadow:0 0 0 3px rgba(217,95,53,.16)}
.dot.done{background:var(--ok)}
.dot.doing{background:var(--doing)}
.dot.wait{background:var(--wait)}
.dot.todo{background:#F8F5EE;border:1.5px dashed #D5CEBC}
.dot.part{background:linear-gradient(135deg,var(--ok) 50%,#fff 50%);border:1.5px solid var(--line-2)}

/* 任务行 */
.tlist{display:flex;flex-direction:column}
.trow{
  display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:7px;
  cursor:pointer;transition:.12s;min-width:0;
}
.trow:hover{background:var(--soft)}
.trow .st{width:6px;height:6px;border-radius:50%;flex:none;background:var(--ink-4)}
.trow .tx{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .mt{font-size:10.5px;color:var(--ink-4);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.trow.done .tx{color:var(--ink-4)}

/* 账单 / 愿望 */
.bill{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.bill:last-child{border-bottom:none;padding-bottom:1px}
.bill .amt{
  font-size:11px;font-weight:600;color:var(--wait);background:var(--wait-bg);
  border-radius:5px;padding:2px 6px;flex:none;font-variant-numeric:tabular-nums;
}
.bill.paid .amt{background:var(--ok-bg);color:#12703A}
.bill .info{flex:1;min-width:0}
.bill .tt{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill .sub{font-size:10.5px;color:var(--ink-3)}
.bill .go{
  font-size:10.5px;border:1px solid var(--line-2);border-radius:6px;padding:2px 7px;
  color:var(--ink-2);transition:.12s;flex:none;
}
.bill .go:hover{background:var(--ok);border-color:var(--ok);color:#fff}

.wish{display:flex;align-items:flex-start;gap:8px;padding:6px 0;cursor:pointer}
.wish .bx{
  width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line-2);flex:none;
  margin-top:2px;display:flex;align-items:center;justify-content:center;transition:.13s;background:#fff;
}
.wish:hover .bx{border-color:var(--ok)}
.wish .bx svg{width:9px;height:9px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.wish.on .bx{background:var(--ok);border-color:var(--ok)}
.wish.on .bx svg{opacity:1}
.wish .tt{font-size:12.5px;color:var(--ink-2);line-height:1.45;transition:.13s}
.wish.on .tt{color:var(--ink-4);text-decoration:line-through}

.stat-big{display:flex;align-items:baseline;gap:6px}
.stat-big b{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-big span{font-size:11.5px;color:var(--ink-3)}
.subtle{font-size:11px;color:var(--ink-3);line-height:1.6;margin-top:3px}

/* ═══════ 泳道详情 ═══════ */
.page-hd{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.back{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:#fff;
  display:flex;align-items:center;justify-content:center;transition:.13s;flex:none;
}
.back:hover{background:var(--soft);border-color:var(--ink-4)}
.back svg{width:14px;height:14px;stroke:var(--ink-2);fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.page-hd h1{font-size:18px;font-weight:600;letter-spacing:-.02em}
.page-hd .sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:11px}
.tcard{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  cursor:pointer;transition:.14s;box-shadow:var(--sh);position:relative;
  display:flex;flex-direction:column;
}
.tcard:hover{box-shadow:var(--sh-2);border-color:var(--line-2)}
.tcard .ttl{font-size:13.5px;font-weight:600;letter-spacing:-.005em;margin-bottom:1px;
  display:flex;align-items:center;gap:6px}
.tcard .mt{font-size:11px;color:var(--ink-3);margin-bottom:9px}
.tcard .dots{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.tcard .bar{margin-top:7px}
.tcard .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}
.tcard .pctl{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tcard .nx{
  font-size:10.5px;color:var(--brand-d);background:var(--brand-bg);border-radius:5px;
  padding:1px 6px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tag-pin{
  font-size:9.5px;font-weight:700;color:var(--brand-d);background:var(--brand-bg);
  border-radius:4px;padding:0 4px;letter-spacing:.03em;
}

/* ═══════ 任务详情 ═══════ */
.detail{max-width:820px}
.dhd{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;box-shadow:var(--sh);margin-bottom:11px;
}
.dhd h1{font-size:19px;font-weight:600;letter-spacing:-.02em}
.dhd .mt{font-size:12px;color:var(--ink-3);margin-top:2px}
.dhd .acts{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap;align-items:center}

.olist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.oitem{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line);transition:.12s}
.oitem:last-child{border-bottom:none}
.oitem:hover{background:var(--soft)}
.oitem .sd{
  width:14px;height:14px;border-radius:4px;flex:none;cursor:pointer;transition:.12s;
  border:1.5px solid transparent;
}
.oitem .sd:hover{transform:scale(1.16)}
.oitem .nm{font-size:13px;font-weight:500;width:84px;flex:none}
.oitem .files{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.oitem .fl{
  font-size:11.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%;
}
.oitem .fl:hover{color:var(--brand-d);text-decoration:underline}
.oitem .no-file{font-size:11.5px;color:var(--ink-4)}
.oitem .need{font-size:10.5px;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}
.oitem .note-b{
  font-size:10.5px;border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;flex:none;
  color:var(--ink-3);transition:.12s;
}
.oitem .note-b:hover{border-color:var(--ink-4);color:var(--ink-2)}
.oitem .note-b.has{background:var(--wait-bg);border-color:transparent;color:#96600A;font-weight:500}
.oitem .o-x{
  width:20px;height:20px;border-radius:5px;flex:none;color:var(--ink-4);font-size:11px;
  display:flex;align-items:center;justify-content:center;opacity:.4;transition:.12s;
}
.oitem:hover .o-x{opacity:1}
.oitem .o-x:hover{background:#FDECEA;color:#B42318}

.nextbox{margin-top:11px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh)}
.nextbox label{font-size:11px;color:var(--ink-3);display:block;margin-bottom:6px}
.nextbox textarea{
  width:100%;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;
  font-family:inherit;font-size:12.5px;resize:vertical;min-height:52px;
  color:var(--ink);background:#fff;outline:none;transition:.13s;
}
.nextbox textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(217,95,53,.1)}

.sel{
  border:1px solid var(--line-2);border-radius:8px;background:#fff;padding:6px 9px;
  font-size:12px;color:var(--ink-2);outline:none;cursor:pointer;
}
.sel:focus{border-color:var(--brand)}

/* ═══════ 备注弹层 ═══════ */
.pop{
  position:fixed;z-index:100;background:#fff;border:1px solid var(--line-2);border-radius:11px;
  box-shadow:0 8px 28px rgba(29,26,21,.16);padding:10px;width:246px;display:none;
}
.pop.on{display:block}
.pop textarea{
  width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-family:inherit;
  font-size:12px;resize:none;min-height:54px;outline:none;color:var(--ink);
}
.pop textarea:focus{border-color:var(--brand)}
.pop .row{display:flex;gap:6px;margin-top:7px;justify-content:flex-end}
.pop .row button{font-size:11.5px;padding:3px 10px;border-radius:6px}
.pop .row .ok{background:var(--brand);color:#fff}
.pop .row .ok:hover{background:var(--brand-d)}
.pop .row .no{color:var(--ink-3)}
.pop .row .no:hover{color:var(--ink)}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);
  background:var(--ink);color:#fff;font-size:12.5px;padding:8px 12px 8px 15px;border-radius:9px;
  opacity:0;pointer-events:none;transition:.2s;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.22);
  display:flex;align-items:center;gap:12px;white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .ta{
  font-size:12px;font-weight:600;color:#FFC9AE;border-left:1px solid rgba(255,255,255,.22);
  padding-left:11px;
}
.toast .ta:hover{color:#fff}

/* ═══════ 视图切换 ═══════ */
.seg{margin-left:auto;display:flex;gap:2px;background:#EDE7DA;border-radius:9px;padding:2px;flex:none}
.seg button{font-size:11.5px;padding:4px 11px;border-radius:7px;color:var(--ink-3);transition:.13s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(45,38,26,.09)}

/* ═══════ 看板 ═══════ */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.kcol{
  background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px;
  display:flex;flex-direction:column;gap:7px;min-height:150px;transition:.13s;
}
.kcol-hd{
  display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  color:var(--ink-2);padding:2px 4px 1px;flex:none;
}
.kcol-hd i{width:6px;height:6px;border-radius:2px;flex:none}
.kcol-hd .n{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-weight:500}
.kempty{
  border:1.5px dashed var(--line-2);border-radius:8px;height:52px;
  display:flex;align-items:center;justify-content:center;
  font-size:10.5px;color:var(--ink-4);
}
.kcard{
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;
  cursor:pointer;box-shadow:var(--sh);transition:.13s;
}
.kcard:hover{border-color:var(--line-2);box-shadow:var(--sh-2)}
.kcard .t{
  font-size:12.5px;font-weight:500;line-height:1.4;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.kcard .m{
  font-size:10.5px;color:var(--ink-3);margin-top:5px;
  display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums;
}
.kcard .bar{margin-top:6px;height:2.5px}
.kcol.drop-on{background:var(--brand-bg);border-color:var(--brand)}
.kcol.drop-on .kempty{border-color:var(--brand);color:var(--brand-d)}

/* ═══════ 右键菜单 ═══════ */
.ctx{
  position:fixed;z-index:150;background:#fff;border:1px solid var(--line-2);border-radius:10px;
  box-shadow:0 8px 30px rgba(29,26,21,.18);padding:5px;min-width:178px;display:none;
}
.ctx.on{display:block}
.ctx .it{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 9px;border-radius:6px;
  font-size:12.5px;color:var(--ink-2);text-align:left;transition:.1s;
}
.ctx .it:hover{background:var(--soft);color:var(--ink)}
.ctx .it:disabled{color:var(--ink-4);cursor:default;background:none}
.ctx .it .dm{width:6px;height:6px;border-radius:2px;flex:none}
.ctx .sep{height:1px;background:var(--line);margin:4px 2px}
.ctx .lb{font-size:10px;color:var(--ink-4);letter-spacing:.1em;padding:5px 9px 3px;font-weight:600}
.ctx .tip{font-size:10.5px;color:var(--ink-4);padding:1px 9px 4px}

/* ═══════ 录入弹层 ═══════ */
.modal{
  position:fixed;inset:0;z-index:160;background:rgba(29,26,21,.34);display:none;
  align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px);
}
.modal.on{display:flex}
.mbox{
  background:#fff;border-radius:16px;width:100%;max-width:580px;max-height:86vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 22px 64px rgba(29,26,21,.30);
}
.mhd{display:flex;align-items:center;gap:10px;padding:15px 18px 12px;border-bottom:1px solid var(--line);flex:none}
.mhd h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
.mhd .x{margin-left:auto;color:var(--ink-3);font-size:15px;line-height:1;padding:3px 7px;border-radius:6px}
.mhd .x:hover{background:var(--soft);color:var(--ink)}
.mbd{padding:16px 18px 4px;overflow:auto;flex:1;min-height:0}
.mft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex:none;background:var(--soft)}
.mft .sp{margin-left:auto}

.fld{margin-bottom:13px}
.fld > label{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:5px;letter-spacing:.02em}
.inp{
  width:100%;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:13px;
  outline:none;background:#fff;color:var(--ink);transition:.13s;
}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(217,95,53,.1)}
select.inp{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat;padding-right:26px}
.inp.sm{padding:5px 8px;font-size:12px}
.row2{display:flex;gap:10px;align-items:flex-start}
.row2 > *{flex:1;min-width:0}
.hint{font-size:10.5px;color:var(--ink-4);margin-top:4px;line-height:1.55}
.hint.ok{color:var(--ok)}
.hint.bad{color:#C2410C}

.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{
  border:1px solid var(--line-2);border-radius:7px;padding:6px 11px;font-size:12px;
  color:var(--ink-2);background:#fff;transition:.13s;
}
.pick button:hover{border-color:var(--ink-4)}
.pick button.on{border-color:var(--brand);background:var(--brand-bg);color:var(--brand-d);font-weight:600}

.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw button{width:23px;height:23px;border-radius:7px;border:2px solid transparent;transition:.12s}
.sw button:hover{transform:scale(1.1)}
.sw button.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}

.orow{display:grid;grid-template-columns:1fr 80px 1fr 24px;gap:6px;align-items:center;margin-bottom:6px}
.orow .x{width:24px;height:24px;border-radius:6px;color:var(--ink-4);font-size:12px;display:flex;align-items:center;justify-content:center}
.orow .x:hover{background:#FDECEA;color:#B42318}
.btn.danger{color:#B42318;border-color:#EBC9C4}
.btn.danger:hover{background:#FDECEA;border-color:#D89C93;color:#9A1B12}
.btn.sm{padding:5px 9px;font-size:11.5px;border-radius:7px}

/* ═══════ 目录选择器 ═══════ */
.pk{position:fixed;inset:0;z-index:170;background:rgba(29,26,21,.4);display:none;align-items:center;justify-content:center;padding:24px}
.pk.on{display:flex}
.pkbox{
  background:#fff;border-radius:15px;width:100%;max-width:620px;max-height:82vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 22px 64px rgba(29,26,21,.32);
}
.pkhd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:none}
.pkhd .p{font-size:11.5px;color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkj{display:flex;gap:6px;padding:8px 10px 2px;flex-wrap:wrap;align-items:center}
.pkj span{font-size:10px;color:var(--ink-4);letter-spacing:.1em}
.pkj button{
  font-size:11px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;
  color:var(--ink-3);transition:.12s;
}
.pkj button:hover{border-color:var(--brand);color:var(--brand-d);background:var(--brand-bg)}
.pkl{flex:1;overflow:auto;padding:6px}
.pkrow{
  display:flex;align-items:center;gap:9px;padding:7px 10px;font-size:12.5px;color:var(--ink-2);
  border-radius:7px;cursor:pointer;text-align:left;width:100%;
}
.pkrow:hover{background:var(--soft);color:var(--ink)}
.pkrow svg{width:14px;height:14px;stroke:var(--wait);fill:none;stroke-width:1.7;stroke-linejoin:round;flex:none}
.pkrow.up svg{stroke:var(--ink-3)}
.pkft{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--soft);flex:none}
.pkft .sp{margin-left:auto}

/* 侧栏分组标题旁的 + */
.rgroup::after{order:2}
.rgroup .radd{
  order:3;width:17px;height:17px;border-radius:5px;color:var(--ink-4);font-size:13px;line-height:1;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.rgroup .radd:hover{background:#F0EDE4;color:var(--brand-d)}

/* ═══════ 拖拽 ═══════ */
.dragging{opacity:.35}
[data-drop-lane],[data-drop-today]{transition:background .12s,border-color .12s,box-shadow .12s}
.drop-on{
  background:var(--brand-bg) !important;
  border-color:var(--brand) !important;
  box-shadow:0 0 0 3px rgba(217,95,53,.14) !important;
}
.ritem.drop-on{color:var(--brand-d) !important;font-weight:600}
body.dragging .rail{border-right-color:var(--brand)}

/* ═══════ 响应式 ═══════ */

  .bento{grid-template-columns:repeat(2,minmax(0,1fr))}

  .mbar .logo{width:24px;height:24px;font-size:11px;border-radius:7px}
  .mbar b{font-size:13.5px;font-weight:600;flex:1}

  .mb-btn svg{width:14px;height:14px;stroke:var(--ink-2);fill:none;stroke-width:2;stroke-linecap:round}

<body>
<div id="app">
  <button id="btnSync" hidden>按文件重新同步</button>
  <main class="main" id="main"></main>
</div>
<div class="pop" id="pop">
  <textarea id="popText" placeholder="写一句备注：卡在哪、等谁确认…"></textarea>
  <div class="row">
    <button class="no" id="popCancel">取消</button>
    <button class="ok" id="popSave">保存</button>
  </div>
</div>
<div class="modal" id="modal">
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mhd"><h2 id="mTitle"></h2><button class="x" id="mX" aria-label="关闭弹窗">✕</button></div>
    <div class="mbd" id="mBody"></div>
    <div class="mft" id="mFoot"></div>
  </div>
</div>
<div class="ctx" id="ctx"></div>
<div class="toast" id="toast"></div>

<script src="/assets/lucide/icons.js"></script>
<script src="/workbench.js"></script>
<script src="/shortcuts.js"></script>
<script>
/* ══════════ 基础 ══════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LANE_C = {
  lesson:'#6B5CF6', order:'#4382DF', comic:'#0DB78E', story:'#DE9A26',
  interactive:'#9560F1', health:'#0BA681', money:'#E19A28', learn:'#6B5CF6', family:'#C16AA2'
};
const ST = {
  todo:   {t:'未开始'},
  doing:  {t:'进行中'},
  confirm:{t:'待确认'},
  done:   {t:'完成'}
};
const NEXT_ST = {todo:'doing', doing:'confirm', confirm:'done', done:'todo'};

const S = { lanes: [], presets: [], tasks: [], life: [], route: { view: 'overview', id: null },
            laneMode: localStorage.getItem('wb_lane_mode') === 'kanban' ? 'kanban' : 'card' };

async function api(p, b) {
  const r = await fetch(p, {
    method: b ? 'POST' : 'GET',
    headers: b ? { 'Content-Type': 'application/json' } : {},
    body: b ? JSON.stringify(b) : undefined
  });
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

const PALETTE = ['#D95F35','#2C6BC9','#7C5CD6','#C4761A','#0E8A7E','#15803D','#B07000','#C2337E','#6D4EC4','#4B5563'];
function laneColor(id) {
  const l = S.lanes.find(x => x.id === id);
  return (l && l.accent) || LANE_C[id] || '#6B5CF6';
}

let toastTimer = null;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button class="ta">${esc(action.label)}</button>` : '');
  t.classList.add('on');
  if (action) t.querySelector('.ta').onclick = () => { t.classList.remove('on'); action.run(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), action ? 5200 : 1800);
}

const WD = ['周日','周一','周二','周三','周四','周五','周六'];
function todayStr() { const d = new Date(); return `${d.getMonth()+1}月${d.getDate()}日 · ${WD[d.getDay()]}`; }
function greeting() {
  const h = new Date().getHours();
  if (h < 5) return '夜深了';
  if (h < 9) return '早上好';
  if (h < 12) return '上午好';
  if (h < 14) return '中午好';
  if (h < 18) return '下午好';
  if (h < 23) return '晚上好';
  return '夜深了';
}
const iso = d => {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
};

/* ══════════ 计算 ══════════ */
function taskStat(t) {
  const os = t.outputs || [];
  if (!os.length) return 'todo';
  if (os.every(o => o.status === 'done')) return 'done';
  if (os.some(o => o.status === 'confirm')) return 'confirm';
  if (os.some(o => o.status === 'doing' || o.status === 'done')) return 'doing';
  return 'todo';
}
const doneN = t => (t.outputs || []).filter(o => o.status === 'done').length;
const missN = t => (t.outputs || []).filter(o => o.status !== 'done').length;
const totalN = t => (t.outputs || []).length;
const pct = t => { const n = totalN(t); return n ? Math.round(doneN(t) / n * 100) : 0; };

function laneOf(id) { return S.lanes.find(l => l.id === id) || { id, name: id, kind: 'work', outputs: [] }; }
function tasksIn(laneId) {
  return S.tasks
    .filter(t => t.lane === laneId)
    .map((t, i) => ({ t, i }))
    .sort((a, b) => (a.t.order ?? 1e9) - (b.t.order ?? 1e9) || a.i - b.i)
    .map(x => x.t);
}
function dotCls(o) {
  if (o.status === 'done') return 'done';
  if (o.status === 'doing') return 'doing';
  if (o.status === 'confirm') return 'wait';
  if (o.got > 0) return 'part';
  return 'todo';
}

/* ══════════ 侧栏 ══════════ */

/* ══════════ 总览 ══════════ */
function renderOverview() { renderWorkPage(); }


/* ══════════ 泳道 ══════════ */
const KCOLS = [
  { st:'todo',    t:'未开始', c:'#B4ADA0' },
  { st:'doing',   t:'进行中', c:'#2C6BC9' },
  { st:'confirm', t:'待确认', c:'#B07000' },
  { st:'done',    t:'已完成', c:'#15803D' }
];

function renderLane(lid) {
  const l = laneOf(lid);
  const isLife = l.kind === 'life';

  let h = `<div class="wrap"><div class="page-hd">
      <button class="back" data-go="overview"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div><h1>${esc(l.name)}</h1>
        <div class="sub">${isLife ? '生活 · ' + (l.model==='habit'?'打卡看连续':(l.model==='bill'?'账单到期':'想做就划掉')) : (l.outputs||[]).map(o=>o.name).join(' · ')}</div>
      </div>
      ${isLife
        ? `<button class="btn sm" data-newlife="${lid}">＋ 新建条目</button>`
        : `<button class="btn sm" data-newtask="${lid}">＋ 新建任务</button>`}
      <button class="btn sm" data-laneset="${lid}" title="改名字、颜色、产出清单">设置</button>
      ${isLife ? '' : `<div class="seg">
        <button class="${S.laneMode==='card'?'on':''}" data-lmode="card">卡片</button>
        <button class="${S.laneMode==='kanban'?'on':''}" data-lmode="kanban">看板</button>
      </div>`}
    </div>`;

  if (isLife) {
    h += renderLifeLane(l);
  } else {
    const ts = tasksIn(lid);
    if (!ts.length) {
      h += `<div class="empty" style="padding:30px">这条线还没有任务<br>
        <button class="btn sm" data-newtask="${lid}" style="margin-top:12px">＋ 新建第一个任务</button><br>
        <span style="font-size:11px;color:var(--ink-4)">也可以从别的分组拖一个过来</span></div>`;
    } else if (S.laneMode === 'kanban') {
      h += renderKanban(lid, ts);
    } else {
      h += `<div class="cards" id="wb-lane-projects" data-sort-lane="${esc(lid)}"></div>${wbPager()}`;
    }
  }
  h += `</div>`;
  $('#main').innerHTML = h;
}

/* 看板：按整件事的状态分四栏，拖过去就整件改状态 */
function renderKanban(lid, ts) {
  const groups = { todo: [], doing: [], confirm: [], done: [] };
  ts.forEach(t => { (groups[taskStat(t)] || groups.todo).push(t); });
  let h = `<div class="kanban">`;
  KCOLS.forEach(col => {
    const arr = groups[col.st] || [];
    h += `<div class="kcol" data-drop-status="${col.st}">
      <div class="kcol-hd"><i style="background:${col.c}"></i>${col.t}<span class="n num">${arr.length}</span></div>`;
    h += arr.map(t => {
      const p = pct(t);
      return `<div class="kcard" data-task="${t.id}" draggable="true">
        <div class="t">${esc(t.title)}</div>
        <div class="m"><span>${doneN(t)}/${totalN(t)} 项</span><span>${p}%</span></div>
        <div class="bar"><i class="${p===100?'g':''}" style="width:${p}%"></i></div>
      </div>`;
    }).join('');
    if (!arr.length) h += `<div class="kempty">拖到这里</div>`;
    h += `</div>`;
  });
  h += `</div><div class="subtle" style="margin-top:10px">把卡片拖到另一栏，整件事下的所有产出会一起改成那个状态。</div>`;
  return h;
}

function renderLifeLane(l) {
  const items=S.life.filter(i=>i.lane===l.id);
  return items.length ? '<div class="wb-life-grid">'+items.map(wbLifeCard).join('')+'</div>' : wbEmpty('这个分组还没有记录','从一件想做的小事开始。',`<button class="btn primary" data-newlife="${esc(l.id)}">＋ 新建条目</button>`);
}

/* ══════════ 任务详情 ══════════ */
function renderTask(tid, target = $('#main')) {
  const t = S.tasks.find(x => x.id === tid);
  if (!t) { S.route = {view:'overview', id:null}; return render(); }
  const p = pct(t);
  const lanes = S.lanes.filter(l => l.kind === 'work');

  let h = `<div class="wrap"><div class="detail">
    <div class="page-hd">
      <button class="back" data-go="lane" data-id="${t.lane}" aria-label="返回分组"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>
    <div class="dhd">
      <h1>${esc(t.title)}</h1>
      <div class="mt">${esc(t.meta || '')} · ${doneN(t)}/${totalN(t)} 项完成 · ${p}%</div>
      <div class="bar" style="margin-top:10px;height:4px"><i class="${p===100?'g':''}" style="width:${p}%"></i></div>
      <div class="acts">
        <button class="btn" data-open="${esc(t.path||'')}">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          打开文件夹</button>
        <button class="btn ${t.today?'primary':''}" data-pin="${t.id}">${t.today?'已加入今天':'加入今天'}</button>
        <select class="sel" data-move="${t.id}" title="改归类">
          ${lanes.map(l => `<option value="${l.id}" ${l.id===t.lane?'selected':''}>归类：${esc(l.name)}</option>`).join('')}
        </select>
        <button class="btn" data-resync="${t.id}">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>

        <button class="btn" data-edittask="${t.id}">${wi('edit')}编辑任务</button>
      </div>
    </div>
    <div class="olist">`;

  h += (t.outputs||[]).map(o => {
    const cls = dotCls(o);
    const files = (o.files||[]).map(f => {
      const nm = f.split('/').pop();
      return `<span class="fl" data-open="${esc(f)}" data-reveal="1" title="${esc(f)}">${esc(nm)}</span>`;
    }).join('');
    return `<div class="oitem">
      <button class="sd dot ${cls}" data-cyc="${t.id}" data-key="${o.key}" aria-label="${esc(o.name)}：${ST[o.status]?.t||'未开始'}，推进状态" title="点一下推进状态"></button>
      <span class="nm">${wi(/PPT|课件/.test(o.name)?'presentation':/板书|配图/.test(o.name)?'image':'file')}${esc(o.name)}</span><span class="wb-task-state">${ST[o.status]?.t||'未开始'}</span>
      <div class="files">${files || '<span class="no-file">还没有文件</span>'}</div>
      <span class="need num">${o.need>1 ? o.got+'/'+o.need : ''}</span>
      <button class="note-b ${o.note?'has':''}" data-note="${t.id}" data-key="${o.key}">${o.note?'备注':'+ 备注'}</button>
      <button class="o-x" data-rmout="${t.id}" data-key="${o.key}" title="这类事不需要这一项，删掉">✕</button>
    </div>`;
  }).join('');

  h += `<div class="oitem" style="justify-content:center;border-bottom:none">
      <button class="btn sm" data-addout="${t.id}">${wi('plus')}添加一项产出</button>
    </div>`;

  h += `</div>
    <div class="nextbox">
      <label>下一步（离开自动保存）</label>
      <textarea id="nextInput" placeholder="写一句具体的：补第二课时板书、导出 PDF 后发布…">${esc(t.next||'')}</textarea>
    </div>
  </div></div>`;

  target.innerHTML = h;

  const ni = target.querySelector('#nextInput');
  if(ni){ni.value=SC.drafts.get(tid+'::next')??t.next??'';ni.dataset.scDraft=tid;ni.dataset.scField='next';ni.oninput=()=>SC.drafts.set(tid+'::next',ni.value);ni.onblur=()=>scSaveDraft(ni);}

}

/* ══════════ 生活辅助 ══════════ */
function isPaid(b) {
  const d = new Date();
  return b.paidMonth === `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function dueIn(b) {
  const now = new Date(); now.setHours(0,0,0,0);
  const dd = b.dueDay || 1;
  let t = new Date(now.getFullYear(), now.getMonth(), dd);
  if (t < now) t = new Date(now.getFullYear(), now.getMonth()+1, dd);
  return Math.round((t - now) / 86400000);
}

/* ══════════ 渲染 ══════════ */
function syncHash() {
  const h = S.route.view === 'overview' ? '#/' : `#/${S.route.view}/${S.route.id || ''}`;
  if (location.hash !== h) { try { history.replaceState(null, '', h); } catch (e) {} }
}
function render() {
  if (S.route.view === 'lane') renderLane(S.route.id);
  else if (S.route.view === 'task') renderTask(S.route.id);
  else if (S.route.view === 'today') renderTodayPage();
  else if (S.route.view === 'life') renderLifePage();
  else if (S.route.view === 'settings') renderSettingsPage();
  else renderOverview();
  $('#main').insertAdjacentHTML('afterbegin', workbenchHeader());
  syncHash();
  wbSetupPagination();
  wbRefreshTask();
  wbRefreshQuick();
}

/* ══════════ 拖拽 ══════════ */
let drag = null;   // { id, lane, today, status, el, moved, saved }
let zone = null;

function clearZone() {
  if (zone) zone.classList.remove('drop-on');
  zone = null;
}

document.addEventListener('dragstart', e => {
  const el = e.target.closest && e.target.closest('[data-task]');
  if (!el) return;
  const t = S.tasks.find(x => x.id === el.dataset.task);
  if (!t) return;
  drag = { id: t.id, lane: t.lane, today: !!t.today, status: taskStat(t),
           el, moved: false, saved: false };
  el.classList.add('dragging');
  document.body.classList.add('dragging');
  try {
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', t.id);
  } catch (err) {}
});

document.addEventListener('dragend', () => {
  document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging'));
  document.body.classList.remove('dragging');
  clearZone();
  /* 拖了但没落下：把临时挪动的 DOM 还原成服务端顺序 */
  const reset = drag && drag.moved && !drag.saved;
  drag = null;
  if (reset) render();
});

document.addEventListener('dragover', e => {
  if (!drag) return;

  /* ① 泳道内排序：实时把卡片挪到指针位置 */
  const grid = e.target.closest && e.target.closest('.cards[data-sort-lane]');
  if (grid && drag.lane === grid.dataset.sortLane) {
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch (err) {}
    clearZone();
    const over = e.target.closest('.tcard');
    if (over && over !== drag.el) {
      const r = over.getBoundingClientRect();
      const after = (e.clientX - r.left) > r.width / 2;
      const ref = after ? over.nextSibling : over;
      if (ref !== drag.el && drag.el.nextSibling !== ref) {
        grid.insertBefore(drag.el, ref);
        drag.moved = true;
      }
    }
    return;
  }

  /* ② 看板改状态 */
  const kz = e.target.closest && e.target.closest('[data-drop-status]');
  if (kz) {
    if (kz.dataset.dropStatus === drag.status) { clearZone(); return; }
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch (err) {}
    if (zone !== kz) { clearZone(); zone = kz; kz.classList.add('drop-on'); }
    return;
  }

  const lz = e.target.closest && e.target.closest('[data-drop-life]');
  if (lz) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'none';
    if (zone !== lz) { clearZone(); zone = lz; lz.classList.add('drop-on'); }
    return;
  }
  const z = e.target.closest && e.target.closest('[data-drop-lane],[data-drop-today]');
  if (!z) { clearZone(); return; }
  const lane = z.dataset.dropLane;
  if (lane && lane === drag.lane && !z.dataset.dropToday) { clearZone(); return; }
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (zone !== z) { clearZone(); zone = z; z.classList.add('drop-on'); }
});

document.addEventListener('dragleave', e => {
  if (zone && e.target === zone && !zone.contains(e.relatedTarget)) clearZone();
});

document.addEventListener('drop', async e => {
  if (!drag) return;

  /* ① 泳道内排序落盘 */
  const grid = drag.el && drag.el.closest && drag.el.closest('.cards[data-sort-lane]');
  if (grid) {
    e.preventDefault();
    clearZone();
    if (!drag.moved) { drag.el.classList.remove('dragging'); return; }
    drag.saved = true;
    const visible = [...grid.querySelectorAll('[data-task]')].map(x => x.dataset.task);
    let vi=0;
    const ids = tasksIn(grid.dataset.sortLane).map(t=>visible.includes(t.id)?visible[vi++]:t.id);
    try {
      await api('/api/reorder', { lane: grid.dataset.sortLane, ids });
      ids.forEach((id, i) => { const tk = S.tasks.find(x => x.id === id); if (tk) tk.order = i; });
      toast('顺序已保存');
    } catch (err) { toast('排序没存上，已还原'); }
    render();
    return;
  }

  /* ② 看板改状态 */
  const kz = e.target.closest && e.target.closest('[data-drop-status]');
  if (kz) {
    e.preventDefault(); clearZone();
    const st = kz.dataset.dropStatus;
    if (st !== drag.status) await setAllStatus(drag.id, st);
    return;
  }

  const lz = e.target.closest && e.target.closest('[data-drop-life]');
  if (lz) {
    e.preventDefault(); clearZone();
    toast('生活是按天打卡和划掉的，跟工作的产出清单不是一套，不能直接拖过来');
    return;
  }
  const z = e.target.closest && e.target.closest('[data-drop-lane],[data-drop-today]');
  if (!z) return;
  e.preventDefault();
  const id = drag.id, fromLane = drag.lane, wasToday = drag.today;
  clearZone();

  /* 拖到「今天」 */
  if (z.dataset.dropToday) {
    if (wasToday) { toast('已经在今天了'); return; }
    const t = S.tasks.find(x => x.id === id);
    if (!t) return;
    try {
      await api('/api/task', { taskId: id, today: true });
      t.today = true;
      toast('已置顶到今天', { label: '撤销', run: async () => {
        t.today = false; await api('/api/task', { taskId: id, today: false }); render();
      }});
      render();
    } catch (err) { toast('操作失败'); }
    return;
  }

  /* 拖到某个分组 */
  const lane = z.dataset.dropLane;
  if (!lane || lane === fromLane) return;
  await moveTask(id, lane);
});

/* ══════════ 任务批量操作（拖拽 / 右键共用） ══════════ */
async function setAllStatus(id, st) {
  const t = S.tasks.find(x => x.id === id);
  if (!t) return;
  const prev = JSON.parse(JSON.stringify(t.outputs || []));
  try {
    const r = await api('/api/task', { taskId: id, allStatus: st });
    Object.assign(t, r.task);
    render();
    toast(st === 'done' ? '整件事标为已完成' : `整件改为「${ST[st].t}」`, { label: '撤销', run: async () => {
      try {
        const back = await api('/api/task', { taskId: id, outputs: prev });
        Object.assign(t, back.task); render(); toast('已撤销');
      } catch (err) { toast('撤销失败'); }
    }});
  } catch (err) { toast('操作失败'); }
}

async function moveTask(id, lane) {
  const t = S.tasks.find(x => x.id === id);
  if (!t || lane === t.lane) return;
  const from = t.lane;
  const prevOutputs = JSON.parse(JSON.stringify(t.outputs || []));
  const laneName = laneOf(lane).name;
  try {
    const r = await api('/api/task', { taskId: id, lane });
    Object.assign(t, r.task);
    render();
    toast(`已归入「${laneName}」`, { label: '撤销', run: async () => {
      try {
        const back = await api('/api/task', { taskId: id, lane: from, outputs: prevOutputs });
        Object.assign(t, back.task); render(); toast('已撤销');
      } catch (err) { toast('撤销失败'); }
    }});
  } catch (err) { toast('移动失败'); }
}

async function resyncTask(id) {
  try {
    const r = await api('/api/sync', { taskId: id });
    const st = S.tasks.find(x => x.id === id);
    const nt = (r.state.tasks || []).find(x => x.id === id);
    if (st && nt) st.outputs = nt.outputs;
    toast('已重新认文件'); render();
  } catch (err) { toast('同步失败'); }
}

/* ══════════ 交互 ══════════ */
document.addEventListener('click', async e => {
  const t = e.target;

  const cxa = t.closest('#ctx [data-act]');
  if (cxa) { e.stopPropagation(); await runCtx(cxa); return; }
  if (!t.closest('#ctx')) closeCtx();

  const lm = t.closest('[data-lmode]');
  if (lm) {
    S.laneMode = lm.dataset.lmode === 'kanban' ? 'kanban' : 'card';
    try { localStorage.setItem('wb_lane_mode', S.laneMode); } catch (err) {}
    render();
    return;
  }

  const nl = t.closest('[data-newlane]');
  if (nl) { openLaneForm(null, nl.dataset.newlane); return; }
  const nt = t.closest('[data-newtask]');
  if (nt) { openTaskForm(null, nt.dataset.newtask); return; }
  const nf = t.closest('[data-newlife]');
  if (nf) { openLifeForm(nf.dataset.newlife); return; }
  const ls = t.closest('[data-laneset]');
  if (ls) { openLaneForm(ls.dataset.laneset); return; }
  const et = t.closest('[data-edittask]');
  if (et) { openTaskForm(et.dataset.edittask); return; }
  const ao = t.closest('[data-addout]');
  if (ao) { openAddOutput(ao.dataset.addout); return; }
  const ro = t.closest('[data-rmout]');
  if (ro) { return scRemove('output',ro.dataset.key,ro.dataset.rmout);
    const tid = ro.dataset.rmout, key = ro.dataset.key;
    const tk = S.tasks.find(x => x.id === tid);
    const oo = tk && (tk.outputs || []).find(x => x.key === key);
    if (!oo) return;
    if (!confirm('把「' + oo.name + '」从这件事里去掉？只影响这一个任务，不动磁盘文件。')) return;
    try {
      const r = await api('/api/output/del', { taskId: tid, key });
      Object.assign(tk, r.task); render(); toast('已去掉');
    } catch (err) { toast(err.message); }
    return;
  }

  const go = t.closest('[data-go]');
  if (go) {
    S.route = { view: go.dataset.go, id: go.dataset.id || null };
    render();
    window.scrollTo({top:0, behavior:'instant'});
    return;
  }


  const op = t.closest('[data-open]');
  if (op) {
    e.stopPropagation();
    const path = op.dataset.open;
    if (!path) { toast('这个任务还没有关联路径'); return; }
    try {
      await api('/api/open', { path, reveal: !!op.dataset.reveal });
      toast(op.dataset.reveal ? '已在访达中定位' : '已打开');
    } catch (err) { toast('打开失败：路径可能已移动'); }
    return;
  }

  const cy = t.closest('[data-cyc]');
  if (cy) { wbOpenQuick(cy.dataset.cyc,cy);return;
    e.stopPropagation();
    const tid = cy.dataset.cyc, key = cy.dataset.key;
    const tk = S.tasks.find(x => x.id === tid);
    const o = tk && (tk.outputs||[]).find(x => x.key === key);
    if (!o) return;
    if (cy.disabled) return;
    const previous = o.status;
    const nx = NEXT_ST[o.status] || 'doing';
    cy.disabled = true;
    o.status = nx;
    const keep = cy.classList.contains('sd') ? 'sd ' : '';
    cy.className = keep + 'dot ' + (nx === 'confirm' ? 'wait' : nx);
    try {
      await api('/api/output', { taskId: tid, key, status: nx });
      const expanded = [...document.querySelectorAll('.wb-outputs[open]')].map(x=>x.closest('[data-task]').dataset.task);
      render();
      document.querySelectorAll('.wb-project[data-task]').forEach(el=>{if(expanded.includes(el.dataset.task)&&el.querySelector('details'))el.querySelector('details').open=true;});
      toast(`${o.name} · ${ST[nx].t}`);
    } catch (err) { o.status=previous; render(); toast('保存失败，状态已恢复'); }
    return;
  }

  const ck = t.closest('[data-check]');
  if (ck) {
    const it = S.life.find(x => x.id === ck.dataset.check);
    if (!it) return;
    const on = !it.doneToday;
    try {
      const r = await api('/api/life/check', { id: it.id, on });
      Object.assign(it, r.item);
      toast(on ? (it.streak > 1 ? `连续 ${it.streak} 天` : '今天打上了') : '已取消');
      render();
    } catch (err) { toast('保存失败'); }
    return;
  }

  const wsh = t.closest('[data-wish]');
  if (wsh) {
    const it = S.life.find(x => x.id === wsh.dataset.wish);
    if (!it) return;
    const val = it.doneAt ? null : iso(new Date());
    try {
      const r = await api('/api/life/item', { id: it.id, doneAt: val });
      Object.assign(it, r.item);
      toast(val ? '划掉了' : '已撤销');
      render();
    } catch (err) { toast('保存失败'); }
    return;
  }

  const pay = t.closest('[data-pay]');
  if (pay) {
    const it = S.life.find(x => x.id === pay.dataset.pay);
    if (!it) return;
    const d = new Date();
    try {
      const r = await api('/api/life/item', { id: it.id, paidMonth: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` });
      Object.assign(it, r.item);
      toast('本月已付');
      render();
    } catch (err) { toast('保存失败'); }
    return;
  }

  const nb = t.closest('[data-note]');
  if (nb) { e.stopPropagation(); openNote(nb.dataset.note, nb.dataset.key, nb); return; }

  const pin = t.closest('[data-pin]');
  if (pin) {
    const tk = S.tasks.find(x => x.id === pin.dataset.pin);
    if (!tk) return;
    try {
      await api('/api/task', { taskId: tk.id, today: !tk.today });
      tk.today = !tk.today;
      toast(tk.today ? '已加入今天' : '已移出今天');
      render();
    } catch (err) { toast('保存失败'); }
    return;
  }

  const rs = t.closest('[data-resync]');
  if (rs) { await resyncTask(rs.dataset.resync); return; }

  if (t.closest('details, summary')) return;
  const tk = t.closest('[data-task]');
  if (tk) {
    S.route = { view: 'task', id: tk.dataset.task };
    render();
    window.scrollTo({top:0, behavior:'instant'});
    return;
  }
});

/* ══════════ 右键菜单 ══════════ */
function closeCtx() {
  const c = $('#ctx');
  if (c && c.classList.contains('on')) c.classList.remove('on');
}

function openCtx(ev, tid) {
  const t = S.tasks.find(x => x.id === tid);
  if (!t) return;
  const others = S.lanes.filter(l => l.kind === 'work' && l.id !== t.lane);
  const miss = missN(t);
  let h = '';
  if (t.path) h += `<button class="it" data-act="open">打开文件夹</button>`;
  h += `<button class="it" data-act="resync">重新认文件</button>`;
  h += `<div class="sep"></div>`;
  h += `<button class="it" data-act="today">${t.today ? '移出今天' : '加入今天'}</button>`;
  h += `<button class="it" data-act="done" ${miss ? '' : 'disabled'}>${miss ? '全部标完成（' + miss + ' 项）' : '已全部完成'}</button>`;
  h += `<button class="it" data-act="edit">编辑任务…</button>`;
  if (others.length) {
    h += `<div class="sep"></div><div class="lb">移动到</div>`;
    h += others.map(l => `<button class="it" data-act="move" data-lane="${l.id}">
      <span class="dm" style="background:${laneColor(l.id)}"></span>${esc(l.name)}</button>`).join('');
  }
  h += `<div class="sep"></div><button class="it" data-act="del" style="color:#B42318">删除任务</button>`;
  const c = $('#ctx');
  c.innerHTML = h;
  c.dataset.task = tid;
  c.style.left = '0px';
  c.style.top = '0px';
  c.classList.add('on');
  const w = c.offsetWidth, hh = c.offsetHeight;
  c.style.left = Math.max(8, Math.min(ev.clientX, window.innerWidth - w - 10)) + 'px';
  c.style.top = Math.max(8, Math.min(ev.clientY, window.innerHeight - hh - 10)) + 'px';
}

async function runCtx(btn) {
  const tid = $('#ctx').dataset.task;
  const t = S.tasks.find(x => x.id === tid);
  const act = btn.dataset.act;
  closeCtx();
  if (!t) return;
  if (act === 'open') {
    if (!t.path) { toast('这个任务没有关联路径'); return; }
    try { await api('/api/open', { path: t.path }); } catch (err) { toast('打开失败'); }
    return;
  }
  if (act === 'resync') { await resyncTask(t.id); return; }
  if (act === 'today') {
    try {
      await api('/api/task', { taskId: t.id, today: !t.today });
      t.today = !t.today;
      toast(t.today ? '已加入今天' : '已移出今天');
      render();
    } catch (err) { toast('保存失败'); }
    return;
  }
  if (act === 'done') { await setAllStatus(t.id, 'done'); return; }
  if (act === 'move') { await moveTask(t.id, btn.dataset.lane); return; }
  if (act === 'edit') { openTaskForm(t.id); return; }
  if (act === 'del') { return scRemove('task',t.id);
    if (!confirm('删掉「' + t.title + '」？只删工作台里的记录，不动磁盘上的文件。')) return;
    try {
      await api('/api/task/del', { taskId: t.id });
      S.tasks = S.tasks.filter(x => x.id !== t.id);
      if (S.route.view === 'task' && S.route.id === t.id) S.route = { view: 'lane', id: t.lane };
      render(); toast('已删除');
    } catch (err) { toast(err.message); }
    return;
  }
}

/* ══════════ 录入：弹层与表单 ══════════ */
function openModal(title, body, foot) {
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = body;
  $('#mFoot').innerHTML = foot;
  $('#modal').classList.add('on');
}
function closeModal() { $('#modal').classList.remove('on'); }
$('#mX').onclick = closeModal;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal').classList.contains('on')) closeModal();
});

/* ── 原生文件夹选择器 ── */
async function openPicker(start, cb) {
  const result=await api('/api/pick-folder', {start:start||''});
  if(!result.cancelled && result.path) cb(result.path);
}

/* ── 任务模板：新建任务时预填一层，只作用于套用它的新任务 ── */
let presetFormAbort = null;
function presetOutputsOf(laneId) {
  const l = S.lanes.find(x => x.id === laneId);
  return (l && l.outputs ? l.outputs : []).map(o => ({
    key: o.key, name: o.name, per: o.per === 'hours' ? 'hours' : 1, detect: detectOf(o)
  }));
}
function sameOutputs(a, b) {
  if (!a || !b || a.length !== b.length) return false;
  return a.every((o, i) => (o.name || '').trim() === (b[i].name || '').trim()
    && String(o.per) === String(b[i].per)
    && (o.detect || '').replace(/\s+/g, '') === (b[i].detect || '').replace(/\s+/g, ''));
}
function openPresetForm(pid, onSaved) {
  const edit = !!pid;
  const p = edit ? (S.presets || []).find(x => x.id === pid) : null;
  const works = S.lanes.filter(l => l.kind === 'work');
  if (!works.length) { toast('先建一个工作分组'); return openLaneForm(null, 'work'); }
  let lane = p ? p.lane : works[0].id;
  if (!works.some(l => l.id === lane)) lane = works[0].id;
  orows = (p && p.outputs && p.outputs.length) ? p.outputs.map(o => ({
    key: o.key, name: o.name, per: o.per === 'hours' ? 'hours' : 1, detect: detectOf(o)
  })) : presetOutputsOf(lane);
  let parent = p ? (p.parent || '') : '';
  let touched = false;

  openModal(edit ? '模板设置' : '新建模板', `
    <div class="row2">
      <div class="fld"><label>模板名称</label>
        <input class="inp" id="pName" value="${esc(p ? p.name : '')}" placeholder="例：四年级教案包"></div>
      <div class="fld" style="flex:0 0 150px"><label>套用于分组</label>
        <select class="inp" id="pLane">${works.map(l =>
          `<option value="${l.id}" ${l.id === lane ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></div>
    </div>
    <div class="row2">
      <div class="fld" style="flex:0 0 120px"><label>课时 / 集数</label>
        <input class="inp" id="pHours" type="number" min="1" max="12" value="${p ? (p.hours || 1) : 2}"></div>
      <div class="fld"><label>父目录（新建时按名称找同名子文件夹）</label>
        <div class="sc-path-row">
          <input class="inp" id="pParent" value="${esc(parent)}" readonly placeholder="未选择，可稍后补">
          <button class="btn" type="button" id="pPick">选择</button></div></div>
    </div>
    <div class="fld"><label>下一步（新建后直接显示在这一单上）</label>
      <input class="inp" id="pNext" value="${esc(p ? (p.next || '') : '')}" placeholder="可留空"></div>
    <div class="fld"><label>这类任务的产出（改动只影响套用它的新任务）</label>
      <div class="outs" id="lOuts"></div>
      <button class="btn sm" type="button" id="lAddOut">＋ 加一项产出</button>
      <p class="hint" id="pOutHint">和分组默认一致时，以后改分组会自动同步。</p>
      <button class="btn sm" type="button" id="pResetOut">沿用分组默认</button></div>
  `, `<button class="btn danger" id="pDel" ${edit ? '' : 'hidden'}>删除模板</button><span class="sp"></span>
      <button class="btn" id="pCancel">取消</button><button class="btn primary" id="pSave">保存</button>`);

  drawOuts();
  const hint = () => {
    const box = $('#pOutHint');
    if (!box) return;
    box.textContent = sameOutputs(orows, presetOutputsOf(lane))
      ? '与分组默认一致，以后改分组会自动同步。'
      : '已自定义，只对套用这个模板的新任务生效。';
  };
  hint();

  $('#pLane').onchange = e => {
    lane = e.target.value;
    if (!touched) { orows = presetOutputsOf(lane); drawOuts(); }
    hint();
  };
  $('#lAddOut').onclick = () => { orows.push({ name: '', per: 1, detect: '' }); touched = true; drawOuts(); hint(); };
  $('#pResetOut').onclick = () => { orows = presetOutputsOf(lane); touched = false; drawOuts(); hint(); };
  // 每次打开表单只保留一套监听，避免反复打开后累积
  if (presetFormAbort) presetFormAbort.abort();
  presetFormAbort = new AbortController();
  const sig = { signal: presetFormAbort.signal };
  $('#mBody').addEventListener('input', e => {
    if (e.target.closest('#lOuts')) { touched = true; hint(); }
  }, sig);
  $('#mBody').addEventListener('click', e => {
    if (e.target.closest('[data-rmrow]')) { touched = true; setTimeout(hint, 0); }
  }, sig);
  $('#pPick').onclick = async () => {
    try {
      await openPicker(parent, p2 => {
        parent = p2;
        if ($('#pParent')) $('#pParent').value = p2;
      });
    } catch (err) { toast(err.message); }
  };
  $('#pCancel').onclick = closeModal;
  $('#pDel').onclick = async () => {
    if (!confirm('删掉模板「' + (p ? p.name : '') + '」？已有任务不受影响。')) return;
    try {
      await api('/api/preset/del', { id: pid });
      S.presets = (S.presets || []).filter(x => x.id !== pid);
      closeModal(); render(); toast('已删除模板');
    } catch (err) { toast(err.message); }
  };
  $('#pSave').onclick = async () => {
    const name = ($('#pName').value || '').trim();
    if (!name) { toast('给模板起个名字'); $('#pName').focus(); return; }
    const btn = $('#pSave'); btn.disabled = true;
    const payload = {
      name, lane, hours: Number($('#pHours').value) || 1, parent, next: $('#pNext').value || '',
      outputs: sameOutputs(orows, presetOutputsOf(lane)) ? null : orows.filter(o => (o.name || '').trim())
    };
    if (edit) payload.id = pid;
    try {
      const r = await api(edit ? '/api/preset/item' : '/api/preset/add', payload);
      S.presets = edit
        ? (S.presets || []).map(x => x.id === pid ? r.preset : x)
        : (S.presets || []).concat([r.preset]);
      closeModal(); render(); toast(edit ? '模板已更新' : '模板已保存，新建任务时可套用');
      if (typeof onSaved === 'function') onSaved(r.preset);
    } catch (err) { toast(err.message); btn.disabled = false; }
  };
}

/* ── 新建 / 编辑任务 ── */

  const works = S.lanes.filter(l => l.kind === 'work');

  openModal(edit ? '编辑任务' : '新建任务', `
    <div class="fld"><label>任务名称</label>
      <input class="inp" id="fTitle" value="${esc(t ? t.title : '')}" placeholder="例：17 长城、第 9 单微课、守株待兔漫画"></div>

      <div class="fld"><label>放在哪个分组</label>

      } else {
        const r = await api('/api/task/add', payload);
        closeModal(); await load();

    } catch (err) { toast(err.message); }

    const back = t.lane;

      closeModal(); S.route = { view: 'lane', id: back }; render(); toast('已删除');
    } catch (err) { toast(err.message); }
  };

/* ── 新建 / 编辑分组（含产出清单） ── */
let orows = [], lKind = 'work', lModel = 'wish', lAccent = PALETTE[0];

function detectOf(o) { return [...(o.kw || []), ...(o.ext || [])].join(', '); }

function drawOuts() {
  const box = $('#lOuts');
  if (!box) return;
  box.innerHTML = orows.map((o, i) => `<div class="orow" data-i="${i}">
      <input class="inp sm" data-f="name" value="${esc(o.name)}" placeholder="逐字稿">
      <select class="inp sm" data-f="per">
        <option value="1" ${o.per !== 'hours' ? 'selected' : ''}>固定 1 份</option>
        <option value="hours" ${o.per === 'hours' ? 'selected' : ''}>按课时</option>
      </select>
      <input class="inp sm" data-f="detect" value="${esc(o.detect || '')}" placeholder="认文件：逐字稿,.docx">
      <button class="x" data-rmrow="${i}" title="删掉这一项">✕</button>
    </div>`).join('') ||
    `<div class="hint" style="margin-bottom:8px">还没有产出项，点下面加一条</div>`;
}

$('#mBody').addEventListener('input', e => {
  const row = e.target.closest('.orow'), f = e.target.dataset.f;

  orows[+row.dataset.i][f] = e.target.value;
});
$('#mBody').addEventListener('change', e => {
  const row = e.target.closest('.orow'), f = e.target.dataset.f;
  if (!row || !f || !orows[+row.dataset.i]) return;
  orows[+row.dataset.i][f] = e.target.value;
});
$('#mBody').addEventListener('click', e => {
  const rm = e.target.closest('[data-rmrow]');

  orows.splice(+rm.dataset.rmrow, 1);

});

  $('#aSave').onclick = go;
  $('#aName').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

/* ══════════ 备注弹层 ══════════ */
let noteCtx = null;
function openNote(tid, key, anchor) {
  const tk = S.tasks.find(x => x.id === tid);
  const o = tk && (tk.outputs||[]).find(x => x.key === key);
  if (!o) return;
  noteCtx = { tid, key, o };
  const pop = $('#pop'), r = anchor.getBoundingClientRect();
  pop.classList.add('on');
  const w = 246, hh = 128;
  let left = Math.min(r.left, window.innerWidth - w - 12);
  let top = r.bottom + 8;
  if (top + hh > window.innerHeight) top = r.top - hh - 8;
  pop.style.left = Math.max(10, left) + 'px';
  pop.style.top = Math.max(10, top) + 'px';
  $('#popText').value = o.note || '';
  $('#popText').focus();
}
$('#popCancel').onclick = () => { $('#pop').classList.remove('on'); noteCtx = null; };
$('#popSave').onclick = async () => {
  if (!noteCtx) return;
  const v = $('#popText').value;
  try {
    await api('/api/output', { taskId: noteCtx.tid, key: noteCtx.key, note: v });
    noteCtx.o.note = v;
    $('#pop').classList.remove('on');
    noteCtx = null;
    toast('备注已保存');
    render();
  } catch (e) { toast('保存失败'); }
};

/* ══════════ 同步 ══════════ */
$('#btnSync').onclick = async () => {
  const b = $('#btnSync');
  b.disabled = true; b.textContent = '同步中…';
  try {
    const r = await api('/api/sync', {});
    await load();
    toast(`已同步，${r.changed} 个任务有变化`);
  } catch (e) { toast('同步失败'); }
  b.disabled = false;
  b.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg> 按文件重新同步`;
};

/* ══════════ 初始化 ══════════ */
function parseHash() {
  const m = (location.hash || '').match(/^#\/([a-z]+)\/(.+)$/);
  if (!m) return null;
  return { view: m[1], id: decodeURIComponent(m[2]) };
}

async function load() {
  const d = await api('/api/state');
  S.lanes = d.templates.lanes || [];
  S.presets = d.templates.presets || [];
  S.tasks = d.state.tasks || [];
  S.life = d.life.items || [];
  S.web = d.web || null;
  const r = parseHash();
  if (r && ['overview','lane','task','today','life','settings'].includes(r.view)) {
    const ok = r.view === 'lane'
      ? S.lanes.some(l => l.id === r.id)
      : r.view === 'task' ? S.tasks.some(t => t.id === r.id) : true;
    if (ok) S.route = r;
  }
  render();
}

window.addEventListener('hashchange', () => {
  const r = parseHash();
  S.route = r || { view: 'overview', id: null };
  render();
});

/* 页面加载只读取数据；按文件同步由用户在「我的」主动执行。 */
(async () => {
  await load();
})().catch(e => {
  $('#main').innerHTML = `<div class="wrap"><div class="empty" style="padding:40px">
    连不上本地服务。<br>请双击「启动工作台.command」启动后再刷新。<br>
    <span style="color:var(--ink-4);font-size:11px">${esc(e.message)}</span></div></div>`;
});

/* ── 界面热更新 ──
   每 2.5 秒比对一次界面指纹，文件一变就自动刷新，
   改 HTML/CSS/JS 不必重新打包 App。
   打包快照（bundled）文件不会变，直接停掉不产生多余请求。
   正在填表时只弹提示条，不打断输入。 */
(function hotReload() {
  if (location.protocol !== 'http:') return;
  const STEP = 2500;
  let stamp = null, pending = false, stop = false, reloading = false;

  const busy = () => {
    const m = document.getElementById('modal');
    if (m && m.classList.contains('on')) return true;
    const a = document.activeElement;
    return !!(a && a.matches && a.matches('input,textarea,select,[contenteditable="true"]'));
  };

  function reload() {
    if (reloading) return;
    reloading = true;
    try { sessionStorage.setItem('wb_hot_n', String((+sessionStorage.getItem('wb_hot_n') || 0) + 1)); } catch (e) {}
    location.reload();
  }

  function notice() {
    if (document.getElementById('hotBar')) return;
    const el = document.createElement('div');
    el.id = 'hotBar';
    el.className = 'hot-bar';
    el.innerHTML = '<span>界面已更新</span><button type="button">立即刷新</button>';
    el.querySelector('button').onclick = reload;
    document.body.appendChild(el);
  }

  async function tick() {
    if (stop || reloading) return;
    if (pending) {
      if (busy()) return;
      return reload();
    }
    let d;
    try {
      const r = await fetch('/api/webinfo', { cache: 'no-store' });
      if (!r.ok) return;
      d = await r.json();
    } catch (e) { return; }
    if (!d || d.bundled) { stop = true; return; }
    if (stamp === null) { stamp = d.stamp; return; }
    if (d.stamp === stamp) return;
    stamp = d.stamp;
    if (busy()) { pending = true; notice(); return; }
    reload();
  }

  setTimeout(tick, 800);
  setInterval(tick, STEP);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
})();
</script>
